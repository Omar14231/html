<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>مركز VR — الشاشة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070B14;
    --blue:#4F6BFF;
    --violet:#9B5DE5;
    --white:#F5F7FF;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background:var(--bg); color:var(--white);
    font-family:'Cairo',sans-serif;
    overflow:hidden; overscroll-behavior:none;
  }
  #app{position:fixed; inset:0;}

  #start{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:28px;
    background:
      radial-gradient(circle at 50% 30%, rgba(79,107,255,0.25), transparent 60%),
      radial-gradient(circle at 50% 80%, rgba(155,93,229,0.18), transparent 55%),
      var(--bg);
    text-align:center; padding:0 32px;
    transition:opacity .6s ease;
  }
  #start h1{ font-size:clamp(22px,6vw,34px); font-weight:900; margin:0; letter-spacing:.5px; }
  #start p{ font-size:15px; color:#A9B4D6; margin:0; max-width:320px; line-height:1.8; }
  #enterBtn{
    font-family:'Cairo',sans-serif; font-weight:700; font-size:17px; color:var(--bg);
    background:linear-gradient(135deg,var(--blue),var(--violet));
    border:none; border-radius:999px; padding:16px 44px;
    box-shadow:0 10px 30px rgba(79,107,255,.35); cursor:pointer;
  }
  #enterBtn:active{transform:scale(.97);}
  .badge{ font-size:12px; color:#6C7AA5; border:1px solid #26305A; border-radius:999px; padding:5px 14px; }
  #connState{ font-size:11px; color:#4A5580; }
  #connState.ok{ color:#4FE29A; }
  #connState.err{ color:#FF6A6A; }

  #intro{
    position:absolute; inset:0; background:#000;
    display:none; align-items:center; justify-content:center;
    overflow:hidden;
  }
  #intro.active{display:flex;}
  #speedlines{position:absolute; inset:0;}
  .line{
    position:absolute; top:50%; left:50%;
    height:2px; width:2px; border-radius:2px;
    background:linear-gradient(90deg, rgba(255,138,61,0) 0%, #FFB088 40%, #FFFFFF 100%);
    transform-origin:left center; opacity:0;
  }
  #introText{ position:relative; z-index:2; text-align:center; opacity:0; transition:opacity .8s ease; }
  #introText .l1{
    display:block; font-size:clamp(20px,6vw,30px); font-weight:900;
    color:var(--blue); text-shadow:0 0 20px rgba(79,107,255,.6);
  }
  #introText .l2{
    display:block; margin-top:10px; font-size:clamp(16px,4.5vw,22px); font-weight:700;
    background:linear-gradient(90deg,var(--violet),#C9A8FF);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  #stereo{ position:absolute; inset:0; display:none; background:#000; }
  #stereo.active{display:block;}
  .eye{
    position:absolute; top:0; bottom:0; width:50%;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; background:#000;
  }
  #eyeL{left:0;} #eyeR{right:0;}
  #divider{ position:absolute; top:0; bottom:0; left:50%; width:1px; background:rgba(255,255,255,.15); z-index:5; }
  .waitMsg{ color:#5A6494; font-size:13px; text-align:center; padding:0 20px; line-height:1.8; }
  .pulseDot{ width:8px; height:8px; border-radius:50%; margin:0 auto 14px; background:var(--blue); animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse{0%,100%{opacity:.25; transform:scale(1);} 50%{opacity:1; transform:scale(1.4);}}

  .eyeVideoWrap{width:100%; height:100%; position:relative;}
  .eyeVideoWrap iframe{
    position:absolute; top:50%; left:50%;
    width:180%; height:100%;
    transform:translate(-50%,-50%);
    border:none;
  }

  #exitBtn{
    position:absolute; top:14px; left:14px; z-index:10;
    width:34px; height:34px; border-radius:50%; border:none;
    background:rgba(255,255,255,.08); color:#fff; font-size:16px;
    display:flex; align-items:center; justify-content:center; opacity:.5;
  }
</style>
</head>
<body>
<div id="app">

  <div id="start">
    <div class="badge">مركز VR</div>
    <h1>ضع الجوال داخل النظارة<br>بعد بدء التجربة</h1>
    <p>ستدخل الشاشة في وضع ملء الشاشة وتنقسم إلى عينين، بانتظار المقطع الذي يختاره المشغّل من الآيباد.</p>
    <button id="enterBtn">بدء تجربة VR</button>
    <span id="connState">جارِ الاتصال بالخادم…</span>
  </div>

  <div id="intro">
    <div id="speedlines"></div>
    <div id="introText">
      <span class="l1">شكراً لتجربتك</span>
      <span class="l2">هنا نبدأ في مركز VR</span>
    </div>
  </div>

  <div id="stereo">
    <button id="exitBtn">✕</button>
    <div class="eye" id="eyeL"><div class="waitMsg" id="msgL"><div class="pulseDot"></div>بانتظار المقطع…</div></div>
    <div class="eye" id="eyeR"><div class="waitMsg" id="msgR"><div class="pulseDot"></div>بانتظار المقطع…</div></div>
    <div id="divider"></div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>

<script>
/* =========================================================
   1) عدّل بيانات مشروعك من Firebase Console هنا:
   Project settings → General → Your apps → SDK setup and configuration
   لازم تكون نفس الإعدادات بالضبط في ملف controller.html
   ========================================================= */
const firebaseConfig = {
  apiKey: "ضع_API_KEY_هنا",
  authDomain: "ضع_PROJECT_ID.firebaseapp.com",
  databaseURL: "https://ضع_PROJECT_ID-default-rtdb.firebaseio.com",
  projectId: "ضع_PROJECT_ID",
  storageBucket: "ضع_PROJECT_ID.appspot.com",
  messagingSenderId: "ضع_SENDER_ID",
  appId: "ضع_APP_ID"
};

// اسم "الغرفة" المشتركة بين الآيباد والجوال — لازم يكون نفسه بالضبط في الملفين
const ROOM = "vr_room_1";
/* ========================================================= */

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const roomRef = db.ref(ROOM + "/command");

(function(){
  const start = document.getElementById('start');
  const intro = document.getElementById('intro');
  const stereo = document.getElementById('stereo');
  const speedlines = document.getElementById('speedlines');
  const introText = document.getElementById('introText');
  const eyeL = document.getElementById('eyeL');
  const eyeR = document.getElementById('eyeR');
  const exitBtn = document.getElementById('exitBtn');
  const connState = document.getElementById('connState');

  let lastTs = 0;

  db.ref(".info/connected").on("value", (snap)=>{
    if(snap.val() === true){
      connState.textContent = "متصل بالخادم ✓";
      connState.className = "ok";
    }else{
      connState.textContent = "غير متصل — تحقق من إعدادات Firebase";
      connState.className = "err";
    }
  });

  function requestFS(){
    const el = document.documentElement;
    const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if(fn){ try{ fn.call(el); }catch(e){} }
  }

  function playChime(){
    try{
      const ctx = new (window.AudioContext||window.webkitAudioContext)();
      const now = ctx.currentTime;
      [523.25,659.25,783.99].forEach((freq,i)=>{
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type='sine'; o.frequency.value=freq;
        g.gain.setValueAtTime(0, now+i*0.18);
        g.gain.linearRampToValueAtTime(0.05, now+i*0.18+0.08);
        g.gain.exponentialRampToValueAtTime(0.0001, now+i*0.18+1.6);
        o.connect(g); g.connect(ctx.destination);
        o.start(now+i*0.18); o.stop(now+i*0.18+1.7);
      });
    }catch(e){}
  }

  function buildSpeedLines(){
    speedlines.innerHTML='';
    const count = 46;
    for(let i=0;i<count;i++){
      const line = document.createElement('div');
      line.className='line';
      const angle = Math.random()*360;
      const dist = 20 + Math.random()*10;
      const len = 40 + Math.random()*220;
      line.style.transform = `translate(-50%,-50%) rotate(${angle}deg) translateX(${dist}px)`;
      line.style.width = '2px';
      line.dataset.angle = angle;
      line.dataset.len = len;
      speedlines.appendChild(line);
    }
  }

  function runSpeedLines(){
    const lines = speedlines.querySelectorAll('.line');
    lines.forEach((line)=>{
      const len = line.dataset.len;
      const delay = Math.random()*400;
      setTimeout(()=>{
        line.style.transition = 'width 900ms cubic-bezier(.15,.7,.3,1), opacity 900ms ease';
        line.style.opacity = '1';
        line.style.width = len+'px';
        setTimeout(()=>{ line.style.opacity='0'; }, 750);
      }, delay);
    });
  }

  function runIntro(){
    intro.classList.add('active');
    buildSpeedLines();
    playChime();
    requestAnimationFrame(runSpeedLines);
    setTimeout(()=>{ introText.style.opacity = '1'; }, 1300);
    setTimeout(()=>{
      intro.style.transition = 'opacity .7s ease';
      intro.style.opacity = '0';
      setTimeout(()=>{
        intro.classList.remove('active');
        intro.style.opacity='1';
        introText.style.opacity='0';
        stereo.classList.add('active');
        listenForCommands();
      }, 700);
    }, 3400);
  }

  document.getElementById('enterBtn').addEventListener('click', ()=>{
    requestFS();
    start.style.opacity='0';
    setTimeout(()=>{ start.style.display='none'; runIntro(); }, 500);
  });

  exitBtn.addEventListener('click', ()=>{
    if(document.fullscreenElement) document.exitFullscreen();
    location.reload();
  });

  function ytEmbedUrl(id){
    return `https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1&controls=0&rel=0&modestbranding=1`;
  }

  function playVideo(videoId){
    const html = `<div class="eyeVideoWrap"><iframe src="${ytEmbedUrl(videoId)}" allow="autoplay; fullscreen" allowfullscreen></iframe></div>`;
    eyeL.innerHTML = html;
    eyeR.innerHTML = html;
  }

  function listenForCommands(){
    roomRef.on('value', (snapshot)=>{
      const data = snapshot.val();
      if(data && data.ts && data.ts !== lastTs && data.videoId){
        lastTs = data.ts;
        playVideo(data.videoId);
      }
    });
  }
})();
</script>
</body>
</html>
