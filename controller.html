<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>مركز VR — لوحة التحكم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070B14;
    --panel:#101a33;
    --blue:#4F6BFF;
    --violet:#9B5DE5;
    --line:#1E2A4D;
    --muted:#7480A6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; height:100%; background:var(--bg); color:#F5F7FF;
    font-family:'Cairo',sans-serif; overflow:hidden;
  }
  #wrap{
    position:fixed; inset:0; display:flex; flex-direction:column;
    padding:28px 32px; gap:22px;
  }
  header{display:flex; flex-direction:column; gap:4px;}
  header .kicker{font-size:12px; color:var(--muted);}
  header h1{margin:0; font-size:22px; font-weight:900;}

  #grid{
    flex:1; display:grid; grid-template-columns:repeat(3,1fr);
    grid-auto-rows:1fr; gap:16px;
  }
  @media (max-width:700px){ #grid{grid-template-columns:repeat(2,1fr);} }

  .clip{
    position:relative; border-radius:20px; border:1px solid var(--line);
    overflow:hidden; cursor:pointer; display:flex; flex-direction:column;
    justify-content:flex-end; padding:16px; min-height:120px;
    transition:transform .15s ease;
  }
  .clip:active{transform:scale(.97);}
  .clip .num{
    position:absolute; top:14px; right:16px; font-size:13px; color:rgba(255,255,255,.7);
  }
  .clip .label{font-size:16px; font-weight:700; position:relative; z-index:2;}
  .clip .sub{font-size:11px; color:rgba(255,255,255,.65); position:relative; z-index:2;}
  .clip.selected{outline:2px solid #fff;}

  footer{display:flex; align-items:center; justify-content:space-between;}
  #status{font-size:13px; color:var(--muted);}
  #status.ok{color:#7CE29A;}

  /* ---------- MODAL ---------- */
  #modalBg{
    position:fixed; inset:0; background:rgba(4,6,14,.72);
    display:none; align-items:center; justify-content:center; z-index:50;
    backdrop-filter:blur(4px);
  }
  #modalBg.show{display:flex;}
  #modal{
    background:var(--panel); border:1px solid var(--line); border-radius:22px;
    padding:32px 28px; width:min(360px,86vw); text-align:center;
  }
  #modal h2{margin:0 0 10px; font-size:19px; font-weight:900;}
  #modal p{margin:0 0 24px; font-size:13px; color:var(--muted); line-height:1.7;}
  .modalBtns{display:flex; gap:12px;}
  .modalBtns button{
    flex:1; font-family:'Cairo',sans-serif; font-weight:700; font-size:15px;
    padding:13px 0; border-radius:12px; border:none; cursor:pointer;
  }
  #yesBtn{background:linear-gradient(135deg,var(--blue),var(--violet)); color:#fff;}
  #noBtn{background:transparent; border:1px solid var(--line); color:#C7CEE8;}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <span class="kicker">لوحة التحكم</span>
    <h1>اختر المقطع لعرضه في النظارة</h1>
  </header>

  <div id="grid"></div>

  <footer>
    <span id="status">لم يُرسل شيء بعد</span>
    <span id="status2" style="font-size:12px;color:var(--muted);">مركز VR</span>
  </footer>
</div>

<div id="modalBg">
  <div id="modal">
    <h2>هل المستخدم يستخدم نظارة VR؟</h2>
    <p id="modalSub">سيتم تشغيل المقدمة ثم المقطع مباشرة على شاشة الجوال داخل النظارة.</p>
    <div class="modalBtns">
      <button id="noBtn">لا</button>
      <button id="yesBtn">نعم، تشغيل</button>
    </div>
  </div>
</div>

<script>
(function(){
  const clips = [
    { id:'AWbPfVlsWq0', label:'المقطع ١', grad:['#4F6BFF','#8A5CFF'] },
    { id:'5vrE_pzxaC4', label:'المقطع ٢', grad:['#FF6A2B','#FF3D77'] },
    { id:'SoCG_AOPJXQ', label:'المقطع ٣', grad:['#12C48B','#2E8FFF'] },
    { id:'fBktnFN9QeU', label:'المقطع ٤', grad:['#9B5DE5','#5B2BFF'] },
    { id:'axnVIBb_FyU', label:'المقطع ٥', grad:['#FFB020','#FF4B4B'] },
  ];

  const grid = document.getElementById('grid');
  const status = document.getElementById('status');
  const modalBg = document.getElementById('modalBg');
  const yesBtn = document.getElementById('yesBtn');
  const noBtn = document.getElementById('noBtn');
  let pending = null;

  clips.forEach((c,i)=>{
    const el = document.createElement('div');
    el.className = 'clip';
    el.style.background = `linear-gradient(155deg, ${c.grad[0]}, ${c.grad[1]})`;
    el.innerHTML = `
      <span class="num">${i+1}/${clips.length}</span>
      <span class="label">${c.label}</span>
      <span class="sub">اضغط للتشغيل في VR</span>
    `;
    el.addEventListener('click', ()=>{
      document.querySelectorAll('.clip').forEach(x=>x.classList.remove('selected'));
      el.classList.add('selected');
      pending = c;
      modalBg.classList.add('show');
    });
    grid.appendChild(el);
  });

  noBtn.addEventListener('click', ()=>{
    modalBg.classList.remove('show');
    document.querySelectorAll('.clip').forEach(x=>x.classList.remove('selected'));
    pending = null;
  });

  yesBtn.addEventListener('click', async ()=>{
    if(!pending) return;
    const payload = JSON.stringify({ videoId: pending.id, ts: Date.now() });
    try{
      await window.storage.set('vr:queue', payload, true);
      status.textContent = `تم إرسال «${pending.label}» إلى النظارة ✓`;
      status.classList.add('ok');
    }catch(e){
      status.textContent = 'تعذّر الإرسال، حاول مرة أخرى';
      status.classList.remove('ok');
    }
    modalBg.classList.remove('show');
  });
})();
</script>
</body>
</html>
