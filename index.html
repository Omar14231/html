<script>

g.connect(AC.destination);g.connect(G.d);g.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wt);wt.connect(AC.destination);wt.connect(G.d);

ts(f.bs.gain,k.ab||0);ts(f.lp.frequency,k.af?22050*Math.pow(.01,k.af/100):22050);
ts(f.wt.gain,(k.ae||0)/100);ts(f.dl.delayTime,k.at||.3);ts(f.fb.gain,Math.min(.9,(k.afb==null?35:k.afb)/100));
m.el.preservesPitch=!k.np;m.el.webkitPreservesPitch=!k.np}};

/* ---- audio sheet: library button, effects, 360 pad ---- */
const _aud=TO.aud;
TO.aud=()=>{const o=_aud(),K=sel();
o.unshift(chips([[ic('music',18)+QA('مكتبة الأغاني','Song library'),0]],()=>openLib()));
if(!AU(K))return o;
const D={at:.3,afb:35},R=(l,a,b,s,key,suf)=>sld(l,a,b,s,K[key]==null?(D[key]||0):K[key],x=>K[key]=x,suf);
o.push(lbl(QA('تأثيرات الصوت','Audio effects')),
R(QA('باس','Bass'),-20,40,1,'ab','dB'),R(QA('كتمة الصوت','Muffle'),0,100,1,'af','%'),
R(QA('صدى','Echo'),0,100,1,'ae','%'),R(QA('زمن الصدى','Echo time'),.05,1.5,.05,'at','s'),R(QA('تكرار الصدى','Echo repeat'),0,90,1,'afb','%'),
chips([[QA('النغمة تتغير مع السرعة','Pitch follows speed'),0]],()=>{K.np=K.np?0:1;save();open('aud')},()=>K.np),
lbl('360°'),chips([[K.a3?QA('360° شغّال','360° on'):QA('تفعيل 360°','Enable 360°'),0]],()=>{K.a3=K.a3?0:1;if(K.a3&&K.az==null){K.ax=0;K.az=-.6}save();open('aud')},()=>K.a3));
if(K.a3){const pd=el('<div class="pad"><span class="hd"></span><i class="sr"></i></div>').firstChild,sr=pd.querySelector('.sr');pd.querySelector('.hd').textContent=QA('أنت','You');
const place=()=>{sr.style.left=((K.ax||0)+1)*50+'%';sr.style.top=((K.az==null?-.6:K.az)+1)*50+'%'};place();
const mv=e=>{const r=pd.getBoundingClientRect();K.ax=Math.max(-1,Math.min(1,(e.clientX-r.left)/r.width*2-1));K.az=Math.max(-1,Math.min(1,(e.clientY-r.top)/r.height*2-1));place()};
let dn=0;pd.onpointerdown=e=>{dn=1;pd.setPointerCapture(e.pointerId);mv(e)};pd.onpointermove=e=>dn&&mv(e);pd.onpointerup=pd.onpointercancel=()=>{if(dn){dn=0;save()}};
o.push(hint(QA('اسحب النقطة: فوق = قدامك، تحت = وراك. الأفضل بسماعة. شغّل المقطع عشان تسمع.','Drag the dot: top = front, bottom = behind. Best with headphones. Play to hear it.')),pd,R(QA('الارتفاع','Height'),-1,1,.05,'ay'))}
return o};

/* ---- smooth, unclipped waveform ---- */
wf=function(k,m){if(!m||!m.pk)return'';const n=Math.max(8,Math.min(600,Math.round(dur(k)*PPS/2))),v=[];
for(let i=0;i<=n;i++){const j=Math.floor((k.in+i/n*k.len)*50);let s=0,c=0;for(let q=-1;q<=1;q++){const x=m.pk[j+q];if(x!=null){s+=x;c++}}v.push(c?s/c:0)}
const g=Math.min(2,Math.max(.3,k.vol)),h=v.map(x=>Math.max(1.5,Math.tanh(x*g*1.3)/Math.tanh(1.3)*46));
let d='M0 '+(50-h[0]);for(let i=1;i<=n;i++)d+='L'+i+' '+(50-h[i]);for(let i=n;i>=0;i--)d+='L'+i+' '+(50+h[i]);
return`<svg class="wf" viewBox="0 0 ${n} 100" preserveAspectRatio="none"><path d="${d}Z" style="fill:#ffffff55;stroke:#ffffffb0;stroke-width:.8;vector-effect:non-scaling-stroke;stroke-linejoin:round"/></svg>`};

/* ---- song library (Openverse, free CC music) ---- */
const GN=[['funk','Funk'],['horror','رعب'],['phonk','Phonk'],['lofi','Lo-fi'],['electronic','إلكتروني'],['hip hop','Hip Hop'],['rock','Rock'],['cinematic','سينمائي'],['jazz','Jazz'],['arabic','عربي'],['ambient','هادئ'],['sfx','مؤثرات']];
const LB={q:'funk',p:1,busy:0,more:1,pid:null},pa=new Audio();let LD,LR;
const icons=()=>LR&&LR.querySelectorAll('.lp1').forEach(x=>x.innerHTML=ic(x.dataset.id==LB.pid&&!pa.paused?'pause':'play',20));
pa.onplay=pa.onpause=pa.onended=icons;
const closeLib=()=>{pa.pause();LD.classList.remove('on')};
async function ld(reset){if(LB.busy)return;if(reset){LB.p=1;LB.more=1;LR.innerHTML=''}if(!LB.more)return;LB.busy=1;const q=LB.q,sk=document.createElement('div');sk.className='sk';LR.append(sk);
try{const sfx=q=='sfx',u='https://api.openverse.org/v1/audio/?q='+encodeURIComponent(sfx?'sound':q)+'&page='+LB.p+'&page_size=20&mature=false&category='+(sfx?'sound_effect':'music'),rs=await fetch(u);if(!rs.ok)throw 0;const j=await rs.json();if(q!=LB.q)return;sk.remove();
const a=j.results||[];if(!a.length&&LB.p==1)LR.innerHTML='<div class="em">'+QA('ما لقيت نتائج، جرّب كلمة ثانية','No results, try another word')+'</div>';
a.forEach((r,i)=>{const d=el('<div class="li"><button class="lp1"></button><div class="lm"><b></b><span></span></div><button class="la"></button></div>').firstChild;d.style.setProperty('--i',i);
d.querySelector('b').textContent=r.title||'—';d.querySelector('span').textContent=[r.creator,r.duration?fmt(r.duration/1000):'',(r.license||'').toUpperCase()].filter(Boolean).join(' · ');
const p=d.querySelector('.lp1'),b=d.querySelector('.la');p.dataset.id=r.id;p.innerHTML=ic('play',20);b.innerHTML=ic('plus',20);
p.onclick=()=>{if(LB.pid==r.id&&!pa.paused){pa.pause();return}LB.pid=r.id;pa.src=r.url;pa.play().catch(()=>toast(QA('ما اشتغلت المعاينة','Preview failed')))};
b.onclick=async()=>{if(b.disabled)return;b.disabled=true;b.classList.add('ld');
try{pa.pause();const bl=await (await fetch(r.url)).blob();if(!bl.size)throw 0;const f=new File([bl],(r.title||'song')+'.mp3',{type:bl.type&&bl.type.startsWith('audio')?bl.type:'audio/mpeg'});busy(1);try{await addFile(f,'aud')}finally{busy(0)}closeLib();toast(QA('انضافت الأغنية للشريط','Added to timeline'))}
catch(x){toast(QA('هذي الأغنية ما تسمح بالتحميل، جرّب غيرها','This track blocks download, try another'))}b.disabled=false;b.classList.remove('ld')};
LR.append(d)});LB.more=a.length>=20&&LB.p<(j.page_count||1)}
catch(x){sk.remove();if(LB.p==1)LR.innerHTML='<div class="em">'+QA('تعذّر تحميل المكتبة. تأكد من الإنترنت وجرّب مرة ثانية.','Could not load the library. Check your connection and try again.')+'</div>'}
finally{sk.remove();LB.busy=0}}

GN.forEach(([k,n])=>{const b=document.createElement('button');b.textContent=n;b.dataset.k=k;b.onclick=()=>{LB.q=k;s.value='';mark();ld(1)};g.append(b)});
