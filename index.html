<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض محمي - CloudMoon</title>
    <style>
        /* إعدادات الصفحة الأساسية */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, sans-serif;
            /* خلفية متدرجة باللون الأسود والبني الداكن */
            background: linear-gradient(-45deg, #050505, #1a0f0a, #2c1810, #0a0604);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            position: relative;
        }

        /* حركة الخلفية */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* حاوية الجزيئات المتحركة في الخلفية */
        #particles-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* الإطار الطولي في منتصف الشاشة */
        .phone-frame {
            position: relative;
            z-index: 2;
            width: 390px; /* عرض شاشة هاتف قياسية */
            height: 85vh; /* ارتفاع طولي يناسب الشاشة */
            max-height: 844px;
            background: #000;
            border-radius: 30px;
            border: 3px solid #3d2314;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 25px rgba(92, 51, 23, 0.4);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* شريط علوي بسيط للتنبيهات */
        .status-bar {
            background: #140b07;
            color: #d4a373;
            font-size: 12px;
            padding: 8px 15px;
            text-align: center;
            border-bottom: 1px solid #2c1810;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-dot {
            height: 8px;
            width: 8px;
            background-color: #2ecc71;
            border-radius: 50%;
            display: inline-block;
            margin-left: 5px;
        }

        /* إطار عرض الموقع */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #0a0a0a;
        }

        /* رسالة التنبيه عند حظر رابط */
        #block-toast {
            position: fixed;
            bottom: 20px;
            background: rgba(44, 24, 16, 0.95);
            color: #ffcdb2;
            border: 1px solid #8c5230;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 10;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            pointer-events: none;
        }

        #block-toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <!-- خلفية الجزيئات -->
    <canvas id="particles-canvas"></canvas>

    <!-- إطار العرض الطولي في المنتصف -->
    <div class="phone-frame">
        <div class="status-bar">
            <span><span class="status-dot"></span> وضع الحماية نشط</span>
            <span>مسموح: تسجيل الدخول / الإيميل فقط</span>
        </div>
        
        <!-- 
            خاصية sandbox هنا تمنع الموقع من فتح نوافذ جديدة أو تغيير الرابط الرئيسي 
            إلا ضمن النطاق المسموح به برمجياً
        -->
        <iframe 
            id="game-frame" 
            src="https://web.cloudmoonapp.com/ar/game/com.epicgames.fortnite/"
            sandbox="allow-scripts allow-same-origin allow-forms"
            allow="gamepad; fullscreen; autoplay; clipboard-read; clipboard-write">
        </iframe>
    </div>

    <!-- تنبيه الحظر -->
    <div id="block-toast">تم منع الانتقال! يُسمح فقط بصفحات تسجيل الدخول والإيميل.</div>

    <script>
        // 1. برمجة خلفية الجزيئات البنية المتحركة
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particlesArray = [];
        const colors = ['rgba(139, 69, 19, 0.3)', 'rgba(92, 51, 23, 0.4)', 'rgba(205, 133, 63, 0.2)'];

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 4 + 1;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * 1 - 0.5;
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            for (let i = 0; i < 60; i++) {
                particlesArray.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // 2. نظام الحماية ومنع الانتقال لغير صفحات الإيميل
        const iframe = document.getElementById('game-frame');
        const toast = document.getElementById('block-toast');

        // الكلمات المفتاحية المسموح بها في الروابط (لتسجيل الدخول وإنشاء الإيميل)
        const allowedAuthKeywords = [
            'login', 'signin', 'signup', 'auth', 'oauth', 
            'account', 'accounts.google', 'epicgames.com/id', 
            'register', 'email', 'mail', 'cloudmoonapp.com'
        ];

        function showToast() {
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        // منع محاولات فتح نوافذ منبثقة من الصفحة الرئيسية
        window.open = function(url) {
            const isAllowed = allowedAuthKeywords.some(keyword => url && url.toLowerCase().includes(keyword));
            if (isAllowed) {
                // إذا كان رابط إيميل أو تسجيل دخول، نسمح بفتحه في نافذة منبثقة مخصصة للإيميل فقط
                return window.originalOpen ? window.originalOpen(url, '_blank', 'width=450,height=650') : null;
            } else {
                showToast();
                console.warn('تم حظر محاولة فتح رابط خارجي:', url);
                return null;
            }
        };

        // منع مغادرة الصفحة الرئيسية نهائياً
        window.addEventListener('beforeunload', function (e) {
            e.preventDefault();
            e.returnValue = '';
        });

        // مراقبة تغييرات الإطار (ملاحظة: المتصفحات تفرض قيود CORS على المواقع الخارجية، 
        // لذا خاصية sandbox في HTML أعلاه هي خط الدفاع الأول والأقوى لمنع أي انتقال خارجي).
        iframe.addEventListener('load', () => {
            try {
                // محاولة الوصول لمحتوى الإطار إن كان متاحاً
                const iframeWin = iframe.contentWindow;
                if (iframeWin) {
                    // اعتراض النقرات داخل الإطار إذا سمحت سياسة المتصفح
                    iframeWin.document.addEventListener('click', (e) => {
                        const link = e.target.closest('a');
                        if (link && link.href) {
                            const isAllowed = allowedAuthKeywords.some(k => link.href.toLowerCase().includes(k));
                            if (!isAllowed) {
                                e.preventDefault();
                                showToast();
                            }
                        }
                    }, true);
                }
            } catch (err) {
                // بسبب حماية المتصفح (Cross-Origin)، خاصية sandbox في وسم iframe 
                // تتولى تلقائياً منع فتح أي نافذة خارجية أو إعلانات أو روابط تحويل.
            }
        });
    </script>
</body>
</html>
