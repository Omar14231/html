<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>غرفة الألغاز</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#050a0d;color:#fff;font-family:Cairo,sans-serif;overflow:hidden}
.s{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;background:radial-gradient(circle at 50% 15%,#0f5a3f,#06140f 70%);text-align:center}
.s.on{display:flex}
button,input,select{font:inherit}
.b{background:linear-gradient(135deg,#1fbf75,#0b8f5a);color:#fff;border:0;border-radius:14px;padding:13px 22px;font-weight:700;font-size:16px;min-width:200px}
.b.o{background:#0e2a21;border:1px solid #2a7a58;min-width:90px}
.b:disabled{opacity:.4}
.i{background:#0c211a;border:1px solid #2a7a58;color:#fff;border-radius:12px;padding:12px;font-size:18px;text-align:center;width:min(260px,80vw)}
.sm{background:#0e2a21;color:#fff;border:1px solid #2a7a58;border-radius:10px;padding:7px 12px;font-size:13px}
h1{margin:0;font-size:26px}
.pr{background:#0e2a21;border:1px solid #2a7a58;border-radius:12px;padding:10px 24px;margin:4px;min-width:200px}
.bd{flex:1;width:100%;font-size:min(20px,4.2vh);border:2px solid #2d6a53;border-radius:16px;background:linear-gradient(160deg,#0e4a38,#082c21);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:10px}
.bd>div{text-align:center;max-width:100%;line-height:1.5}
.t .bd{font-size:min(14px,2.6vh)}
.qt{position:absolute;top:0;left:50%;transform:translateX(-50%);background:#c01818;color:#fff;font-size:12px;padding:3px 12px;border-radius:0 0 10px 10px;max-width:96%;text-align:center;font-weight:700}
.nt{position:absolute;bottom:-12px;right:12px;background:#f90;color:#000;font-weight:900;border-radius:999px;padding:3px 14px;font-size:13px}
#tm{font-size:22px;font-weight:900;background:rgba(0,0,0,.45);border:2px solid #3aa0ff;border-radius:999px;padding:3px 14px;font-family:monospace}
#blk{position:fixed;inset:0;background:#000;z-index:99;display:none}
</style></head><body>

<div id="h" class="s on">
<h1>🧩 غرفة الألغاز</h1>
<input id="nm" class="i" placeholder="اكتب اسمك" maxlength="12">
<button class="b" id="cr">إنشاء روم</button>
<div style="display:flex;gap:8px"><input id="rc" class="i" style="width:140px;letter-spacing:2px;text-transform:uppercase" placeholder="رقم الروم" maxlength="6"><button class="b o" id="jn">دخول</button></div>
<button class="b o" id="tu1" style="min-width:200px">تتوريال</button>
<div id="er" style="color:#ff7777;min-height:22px"></div>
</div>

<div id="l" class="s">
<div>رقم الروم</div><h1 id="lc" style="letter-spacing:5px;font-family:monospace;font-size:38px"></h1>
<div id="pl"></div><button class="b" id="st">ابدأ اللعبة</button><div id="lm" style="color:#9fd"></div>
</div>

<div id="g" class="s" style="justify-content:flex-start;gap:0;padding:0">
<div style="position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:center;z-index:5;direction:ltr">
<div style="display:flex;gap:6px;align-items:center"><select id="lv" class="sm"></select><button id="sk" class="sm">تخطي</button><span id="vt" style="font-size:12px"></span></div>
<div id="tm">00:00</div></div>
<div id="bw" style="margin-top:56px;width:min(94vw,700px);height:min(52vh,420px);position:relative;display:flex"></div>
<div id="an" style="margin-top:26px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:0 10px"></div>
</div>

<div id="tu" class="s t" style="justify-content:flex-start;gap:8px;padding-top:50px">
<button id="tx" class="sm" style="position:absolute;top:10px;left:10px;font-size:18px">✕</button>
<div style="display:flex;gap:10px;align-items:center"><button class="sm" id="tp">السابق</button><b id="tn"></b><button class="sm" id="tq">التالي</button></div>
<div id="ti" style="width:min(94vw,520px);display:flex;flex-direction:column;gap:16px;flex:1;min-height:0"></div>
<div id="ta" style="color:#7dffb5;font-weight:700;padding-bottom:8px"></div>
</div>

<div id="en" class="s"><h1>🎉 خلصتوا كل المراحل!</h1><div style="font-size:18px">وقتكم الكلي</div><div id="et" style="font-size:46px;font-weight:900;font-family:monospace"></div><button class="b" onclick="location.reload()">لعب من جديد</button></div>
<div id="blk"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
const show=id=>document.querySelectorAll('.s').forEach(e=>e.classList.toggle('on',e.id==id));
const uid=Math.random().toString(36).slice(2,9);
let name='';try{name=localStorage.getItem('pzn')||''}catch(e){}
let room,host=false,cl,T,G,pls=[],seat=-1,t0=0,run=0,joined=0,cur=null,tl=0;

/* ============ المراحل (25 مرحلة عشوائية) ============ */
const LV=[];for(let k=0;k<4;k++)[[1,4],[2,4],[3,4],[4,2],[5,3],[6,2],[7,3],[8,3]].forEach(([f,c])=>k<c&&LV.push([f,k]));
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gen(i,seed){
const r=rng(seed),ri=(a,b)=>a+Math.floor(r()*(b-a+1)),sh=a=>a.map(x=>[r(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]),[f,p]=LV[i];
const U=g=>{let n;do n=[0,1,2].map(g);while(new Set(n).size<3);return n};
let b,q,ty='n',a,qs=ri(0,2),pm=sh([0,1,2]);
if(f==1){const K='▲●■★'[p],O='▲●■★'.replace(K,''),c=[0,1,2].map(()=>ri(1,6));
b=c.map(n=>{let s=Array(n).fill(K);for(let j=ri(2,5);j--;)s.push(O[ri(0,2)]);return sh(s).map(x=>`<span style="font-size:${ri(15,26)/10}em;display:inline-block;transform:rotate(${ri(0,359)}deg);margin:.15em">${x}</span>`).join('')});
a=c[0]+c[1]+c[2];q=`كم عدد ${K} في جميع الصور؟`}
else if(f==2){const n=U(()=>p==3?ri(2,9):ri(5,40)),s=[...n].sort((x,y)=>x-y);
b=n.map(x=>`<b style="font-size:4.5em">${x}</b>`);
a=[n[0]+n[1]+n[2],s[2]-s[0],s[1]+s[2],s[0]*s[2]][p];
q=['كم مجموع الأرقام الثلاثة؟','كم الفرق بين أكبر وأصغر رقم؟','كم مجموع أكبر رقمين؟','كم ناتج أصغر رقم × أكبر رقم؟'][p]}
else if(f==3){const E=[['🍅','🍎'],['🐱','🐶'],['⭐','🌙'],['🚗','🚕']][p],g=Array.from({length:9},()=>E[ri(0,1)]),o=ri(0,2),c=ri(0,8);
b=[0,1,2].map(j=>`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:.1em;font-size:2.2em">${g.map((x,k)=>`<span>${j==o&&k==c?E[1-E.indexOf(x)]:x}</span>`).join('')}</div>`);
ty='p';a=o;q='من صورته مختلفة عن الباقين؟'}
else if(f==4){const W='شمس قمر جمل باب قلم حليم كريم نخلة شجاع مدرسة سيارة حاسوب عصفور فنجان برتقال مستشفى سلحفاة'.split(' ');let w=[];
sh(W).forEach(x=>{if(w.length<3&&!w.some(y=>y.length==x.length))w.push(x)});
b=w.map(x=>`<b style="font-size:3.4em">${x}</b>`);ty='p';const L=w.map(x=>x.length);a=L.indexOf(p?Math.min(...L):Math.max(...L));q=p?'من عنده الكلمة الأقصر؟':'من عنده الكلمة الأطول؟'}
else if(f==5){let P,D,V;do{P=[0,1,2].map(()=>ri(3,20)*10);D=P.map(()=>[10,20,25,30,40,50][ri(0,5)]);V=P.map((x,j)=>p==2?x*D[j]/100:x*(100-D[j])/100)}while(new Set(V).size<3);
b=P.map((x,j)=>`<div style="font-size:1.2em;line-height:1.9">🛍️<br>السعر <b>${x}</b> ريال<br>خصم <b>${D[j]}%</b></div>`);
ty='p';a=V.indexOf(p==1?Math.min(...V):Math.max(...V));q=['من صاحب أغلى سعر بعد الخصم؟','من صاحب أرخص سعر بعد الخصم؟','من وفّر أكبر مبلغ بالخصم؟'][p]}
else if(f==6){const C=[['أحمر','#ff3b3b'],['أزرق','#4a8dff'],['أخضر','#3de05a'],['أصفر','#ffd93b'],['أبيض','#fff']],W=[0,1,2].map(()=>{const w=ri(0,4);return[w,r()<.5?w:ri(0,4)]});
b=W.map(([w,k])=>`<b style="font-size:3.4em;color:${C[k][1]}">${C[w][0]}</b>`);
a=p?W.filter(x=>x[1]==0).length:W.filter(x=>x[0]==x[1]).length;
q=p?'كم لاعب لون الخط عنده أحمر؟':'كم لاعب كُتب عنده اللون بنفس لونه؟'}
else if(f==7){const E=[['🍎','🍌'],['⚽','🏀'],['🚗','🚲']][ri(0,2)],x=ri(2,9),y=ri(2,9),
lb=[`${E[0]}${E[0]} = ${2*x}`,`${E[0]}${E[1]} = ${x+y}`,[`${E[1]}${E[1]}${E[0]}`,`${E[1]}${E[1]}${E[1]}`,`${E[0]}${E[1]}${E[1]}${E[1]}`][p]+' = ؟'];
b=pm.map(j=>`<b dir="ltr" style="font-size:2.6em">${lb[j]}</b>`);qs=pm.indexOf(2);a=[2*y+x,3*y,x+3*y][p];q='كم قيمة الناتج؟'}
else{const d=[0,1,2].map(()=>ri(1,9)),lb=d.map((x,j)=>`الخانة <b>${j+1}</b><br><b style="font-size:3.5em">${x}</b>`);
b=pm.map(j=>lb[j]);a=[+d.join(''),+[...d].reverse().join(''),d[0]+d[1]+d[2]][p];
q=['اكتب الرقم السري (الخانات بالترتيب)','اكتب الرقم السري بالعكس','كم مجموع أرقام الخانات؟'][p]}
return{b,q,qs,ty,a}}
const bdH=x=>`<div class="bd"><div>${x}</div></div>`;
const nz=s=>String(s).trim()===''?NaN:+String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\s/g,'');

/* ============ الاتصال (MQTT عام بدون سيرفر) ============ */
const err=s=>{show('h');$('er').textContent=s};
function send(o){o.f=o.f||uid;const m=new Paho.MQTT.Message(JSON.stringify(o));m.destinationName=T;cl.send(m)}
function conn(cb){T='pzl3x/'+room;cl=new Paho.MQTT.Client('broker.hivemq.com',8884,'pz'+uid+Date.now());
cl.onMessageArrived=m=>{try{on(JSON.parse(m.payloadString))}catch(e){}};
cl.onConnectionLost=()=>{if(run)alert('انقطع الاتصال، حدّث الصفحة')};
cl.connect({useSSL:true,timeout:8,onSuccess:()=>{cl.subscribe(T);cb()},onFailure:()=>err('تعذّر الاتصال بالإنترنت')})}

/* ============ منطق المالك (الحكم) ============ */
function sendL(){G.c=gen(G.o[G.i],Math.random()*1e9|0);G.v.clear();const c=G.c;send({t:'lvl',n:G.i+1,b:c.b,q:c.q,qs:c.qs,ty:c.ty,el:Date.now()-G.t0})}
function hNext(){G.i++;if(G.i>=25){G.on=false;send({t:'end',ms:Date.now()-G.t0})}else sendL()}
function hStart(){if(pls.length<3)return;G.on=true;G.o=[...Array(25).keys()].map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);G.i=0;G.t0=Date.now();sendL()}
function on(m){
if(host){
 if(m.t=='join'){const i=pls.findIndex(p=>p.id==m.f);
  if(i<0){if(pls.length>=3||G.on){send({t:'full',to:m.f});return}pls.push({id:m.f,n:m.n})}else pls[i].n=m.n;
  send({t:'lobby',pl:pls});if(G.on&&i>=0)send({t:'lvl',n:G.i+1,b:G.c.b,q:G.c.q,qs:G.c.qs,ty:G.c.ty,el:Date.now()-G.t0})}
 else if(G.on&&m.t=='ans'&&Date.now()>=G.lk&&pls.some(p=>p.id==m.f)){const c=G.c;
  if(c.ty=='p'?+m.v==c.a:nz(m.v)==c.a)hNext();else{G.lk=Date.now()+15000;send({t:'bad'})}}
 else if(G.on&&m.t=='skip'&&pls.some(p=>p.id==m.f)){G.v.add(m.f);if(G.v.size>=2)hNext();else send({t:'votes',n:G.v.size})}
 else if(G.on&&m.t=='pick'&&m.f==uid&&m.n>=1&&m.n<=25){G.i=m.n-1;sendL()}
}
if(m.t=='full'&&m.to==uid){joined=0;err('الروم ممتلئ (3 لاعبين فقط) أو اللعبة بدأت');return}
if(m.t=='lobby'){pls=m.pl;seat=pls.findIndex(p=>p.id==uid);if(seat<0)return;joined=1;if(!run){lob();show('l')}return}
if(seat<0)return;
if(m.t=='lvl'){cur=m;t0=Date.now()-m.el;run=1;if(!$('g').classList.contains('on'))show('g');draw()}
else if(m.t=='votes')$('vt').textContent='تخطي '+m.n+'/2';
else if(m.t=='bad'){const k=$('blk');k.style.display='block';setTimeout(()=>k.style.display='none',15000)}
else if(m.t=='end'){run=0;const s=m.ms/1000|0;$('et').textContent=pad(s/60|0)+':'+pad(s%60);show('en')}}

/* ============ الواجهة ============ */
const pad=n=>String(n).padStart(2,'0');
function lob(){$('lc').textContent=room;$('pl').innerHTML=[0,1,2].map(j=>`<div class="pr">${pls[j]?(j?'':'👑 ')+esc(pls[j].n):'— بانتظار لاعب —'}</div>`).join('');
$('st').style.display=host?'':'none';$('st').disabled=pls.length<3;$('lm').textContent=host?`اللاعبين ${pls.length}/3 — أرسل الرقم لأصحابك`:'بانتظار المالك يبدأ اللعبة…'}
function draw(){const c=cur;
$('bw').innerHTML=bdH(c.b[seat])+(c.qs==seat?`<div class="qt">${esc(c.q)}</div>`:'')+`<div class="nt">${esc(pls[seat].n)}</div>`;
$('an').innerHTML=c.ty=='p'?pls.map((p,j)=>`<button class="b o" data-j="${j}">${esc(p.n)}</button>`).join(''):`<input id="av" class="i" style="width:160px" inputmode="numeric" placeholder="الجواب"><button class="b o" id="ab">إرسال</button>`;
$('lv').value=c.n;$('vt').textContent=''}
for(let i=1;i<=25;i++)$('lv').add(new Option('مرحلة '+i,i));
$('lv').onchange=()=>{if(host)send({t:'pick',n:+$('lv').value});else $('lv').value=cur?cur.n:1};
$('sk').onclick=()=>send({t:'skip'});
const ans=v=>{if($('blk').style.display=='block')return;send({t:'ans',v})};
$('an').onclick=e=>{const j=e.target.dataset&&e.target.dataset.j;if(j!=null)ans(+j);else if(e.target.id=='ab'){ans($('av').value);$('av').value=''}};
$('an').onkeydown=e=>{if(e.key=='Enter'&&e.target.id=='av'){ans(e.target.value);e.target.value=''}};
setInterval(()=>{if(run){const s=(Date.now()-t0)/1000|0;$('tm').textContent=pad(s/60|0)+':'+pad(s%60)}},300);

$('nm').value=name;
const sv=()=>{name=$('nm').value.trim().slice(0,12);if(!name){$('er').textContent='اكتب اسمك أول';return 0}try{localStorage.setItem('pzn',name)}catch(e){}return 1};
$('cr').onclick=()=>{if(!sv())return;room=Array.from({length:6},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.random()*32|0]).join('');
host=true;pls=[{id:uid,n:name}];seat=0;G={on:false,o:[],i:0,c:null,v:new Set(),lk:0,t0:0};$('er').textContent='جارِ الاتصال…';
conn(()=>{joined=1;lob();show('l')})};
$('jn').onclick=()=>{if(!sv())return;const c=$('rc').value.trim().toUpperCase();if(!c){$('er').textContent='اكتب رقم الروم';return}
room=c;host=false;$('er').textContent='جارِ الدخول…';
conn(()=>{const j=()=>!joined&&send({t:'join',n:name});j();setTimeout(j,2500);setTimeout(()=>{if(!joined){err('الروم غير موجود أو المالك غير متصل');cl.disconnect()}},7000)})};
$('st').onclick=hStart;

$('tu1').onclick=()=>{tl=0;tut();show('tu')};$('tx').onclick=()=>show('h');
$('tp').onclick=()=>{tl=(tl+24)%25;tut()};$('tq').onclick=()=>{tl=(tl+1)%25;tut()};
function tut(){const c=gen(tl,11+tl);$('tn').textContent=`مرحلة ${tl+1} / 25`;
$('ti').innerHTML=c.b.map((x,j)=>`<div style="flex:1;position:relative;min-height:0;display:flex">${bdH(x)}${c.qs==j?`<div class="qt">${esc(c.q)}</div>`:''}<div class="nt">لاعب ${j+1}</div></div>`).join('');
$('ta').textContent='الجواب: '+(c.ty=='p'?'لاعب '+(c.a+1):c.a)}
</script></body></html>
