<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة الألعاب السحابية المجانية</title>
    <style>
        body {
            background-color: #0f172a;
            color: white;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .game-container {
            width: 90%;
            max-width: 1200px;
            height: 650px;
            margin: 20px auto;
            border: 3px solid #38bdf8;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h1>العب Roblox مباشرة في المتصفح مجاناً</h1>
    <div class="game-container">
        <!-- رابط منصة البث السحابي -->
        <iframe src="https://web.cloudmoonapp.com/game/com.roblox.client/" allowfullscreen></iframe>
    </div>

</body>
</html>
